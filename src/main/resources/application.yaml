spring:
  application:
    name: gcp

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=gsp
    username: postgres
    password: retro
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # use 'validate' in prod
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: gsp

server:
  port: 8080
